<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Family Availability & Schedule Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 font-sans pb-12">

  <!-- Header -->
  <header class="bg-indigo-700 text-white shadow-md sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col sm:flex-row items-center justify-between gap-4">
      <div class="flex items-center space-x-3">
        <div class="p-2 bg-indigo-600 rounded-lg">
          <svg class="w-6 h-6 text-indigo-100" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 002-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 id="header-title" class="text-xl font-bold leading-tight">Schedule Tracker</h1>
            <span id="group-badge" class="bg-indigo-900/80 text-indigo-200 text-xs px-2.5 py-0.5 rounded-full font-mono border border-indigo-500/30">Group: Default</span>
          </div>
          <p class="text-xs text-indigo-200">Coordinate availability across dates & time slots</p>
        </div>
      </div>

      <!-- Navigation Tabs -->
      <div class="flex bg-indigo-800/80 p-1 rounded-xl text-sm font-medium border border-indigo-500/30">
        <button id="btn-recipient" onclick="switchTab('recipient')" class="px-4 py-2 rounded-lg transition-all shadow bg-white text-indigo-900 font-semibold">
          👤 Recipient View
        </button>
        <button id="btn-owner" onclick="handleOwnerTabClick()" class="px-4 py-2 rounded-lg transition-all text-indigo-200 hover:text-white flex items-center gap-1.5">
          <span>🔒 Owner Dashboard</span>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 mt-8">

    <!-- RECIPIENT VIEW -->
    <section id="view-recipient" class="space-y-6">
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 border-b border-slate-100 pb-4 mb-6">
          <div>
            <h2 id="rec-event-heading" class="text-xl font-bold text-slate-900">Submit Your Availability</h2>
            <p class="text-slate-500 text-sm">
